<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2A2152">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Piano da Maya">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Piano da Maya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: slim header, scrolling lesson area, and the rainbow keyboard docked on a dark stage at the bottom, always under the fingers */
  color-scheme: light;
  --sky:#ECEFFF; --paper:#FFFFFF; --ink:#2A2152; --ink-soft:#625B8A; --line:#D5D9F5; --sun:#FFD23F;
  --do:#EF3E36; --re:#F7892B; --mi:#F7C61C; --fa:#3FB950; --sol:#1FA9D6; --la:#7557E0; --si:#EC5BA9;
  --display:'Baloo 2','Trebuchet MS','Segoe UI',sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --kh:clamp(140px,36vh,280px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--sky);color:var(--ink);font:500 17px/1.5 var(--body);overflow:hidden;touch-action:pan-y;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
a,button{-webkit-user-drag:none;-webkit-tap-highlight-color:transparent}
.prose{user-select:text;-webkit-user-select:text}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,6vw,44px);font-weight:800}
h2{font-size:24px;font-weight:800}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--la);outline-offset:3px}

/* header */
header{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:8px 16px 13px;background:var(--paper)}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--do) 0 14.28%,var(--re) 0 28.57%,var(--mi) 0 42.85%,var(--fa) 0 57.14%,var(--sol) 0 71.42%,var(--la) 0 85.71%,var(--si) 0)}
.brand{font:800 21px var(--display);text-decoration:none;white-space:nowrap}
header nav{margin-left:auto;display:flex;gap:2px}
header nav a{padding:6px 12px;border-radius:999px;font:700 15px var(--display);color:var(--ink-soft);text-decoration:none}
header nav a.on{background:var(--ink);color:#fff}
@media (max-width:440px){.brand{display:none}header nav{margin:0 auto}}

/* main */
main{flex:1;min-height:0;overflow-y:auto;padding:18px 16px 24px;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lead{max-width:62ch;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:18px;padding:12px 14px;text-decoration:none;box-shadow:0 3px 0 var(--line);min-height:76px}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.card .t{font:700 19px/1.15 var(--display)}
.card .s{font-size:14px;color:var(--ink-soft);line-height:1.3}
.card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid var(--c);display:grid;place-items:center;font:800 21px var(--display)}
.big-e{flex:none;font-size:34px;line-height:1;width:46px;text-align:center}
.stars{flex:none;font-size:15px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.stars b{color:#F0B400;font-weight:400}
.mini{display:flex;gap:3px;margin-top:4px}
.mini i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:14px;height:28px;border-radius:7px;background:var(--c)}
.tally{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--paper);border-radius:999px;padding:6px 16px;font:700 16px var(--display)}
.tally b{color:#F0B400;font-size:20px}

/* lesson */
.back{align-self:flex-start;font:700 15px var(--display);color:var(--ink-soft);text-decoration:none;padding:4px 0}
.ltitle{display:flex;align-items:center;gap:12px}
.ltitle h1{font-size:clamp(26px,5.4vw,38px)}
.stepdots{display:flex;gap:8px}
.sd{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);background:var(--paper);font:800 17px var(--display);color:var(--ink-soft);cursor:pointer}
.sd.done{border-color:#F0B400;color:var(--ink)}
.sd.on{background:var(--ink);border-color:var(--ink);color:#fff}
.say{background:var(--paper);border-radius:18px;padding:14px 16px;border-left:8px solid var(--sun);display:flex;flex-direction:column;gap:6px}
.eyebrow{font:800 12px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.script{font:600 20px/1.35 var(--display);max-width:60ch}
.tip{font-size:15px;color:var(--ink-soft);max-width:65ch}
.act{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.row.end{justify-content:space-between}
.btn{font:800 18px var(--display);padding:10px 22px;min-height:52px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #D9A900}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.pulse{animation:pulse .9s ease-in-out infinite alternate}
.animal{width:clamp(104px,26vh,170px);aspect-ratio:1;border:0;border-radius:28px;background:var(--paper);box-shadow:0 6px 0 var(--line);font:800 17px var(--display);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.animal .ae{font-size:clamp(44px,12vh,72px);line-height:1}
.animal:active{transform:translateY(3px);box-shadow:0 3px 0 var(--line)}
.animal.hop .ae{animation:hop1 .28s ease-out}
.count{font-size:30px;letter-spacing:5px;color:var(--line);line-height:1}
.count b{color:#F0B400;font-weight:400}
.bigcard{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:24px;padding:10px 26px 10px 14px;border:8px solid var(--c);font:800 40px var(--display)}
.bigcard .be{font-size:56px;line-height:1}

/* guide */
.prose{display:flex;flex-direction:column;gap:22px}
.prose section{background:var(--paper);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.prose p,.prose li{max-width:66ch}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:800 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
td:first-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border-radius:999px;padding:1px 12px 1px 5px;font:800 16px var(--display);white-space:nowrap;vertical-align:middle}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c)}
.legend .chip{box-shadow:inset 0 0 0 2px var(--line)}
kbd{font:800 14px var(--display);background:var(--sky);border-radius:6px;padding:1px 7px}

/* dock + keyboard */
.dock{touch-action:none;flex:none;background:var(--ink);border-radius:20px 20px 0 0;padding:6px 8px 10px}
.dock[hidden]{display:none}
.strip{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 6px 6px;color:#fff}
.prompt{flex:none;max-width:62%;font:700 17px/1.2 var(--display)}
.dots{flex:1;min-width:0;display:flex;align-items:center;gap:5px;overflow-x:auto;padding:5px 3px;scrollbar-width:none}
.dots::-webkit-scrollbar{display:none}
.dot{flex:none;width:24px;height:24px;border-radius:12px;background:var(--c)}
.dot.l{width:42px}.dot.xl{width:60px}.dot.s{width:16px;height:16px}
.dot.past{opacity:.3}
.dot.cur{box-shadow:0 0 0 3px #fff;transform:scale(1.12)}
.keys{position:relative;display:flex;height:var(--kh);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.wk{flex:1;min-width:0;margin:0 2px;padding:0 0 12px;border:0;border-radius:0 0 14px 14px;background:var(--c);box-shadow:inset 0 -12px 0 rgba(0,0,0,.14),inset 0 5px 0 rgba(255,255,255,.28);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.wk .em{font-size:clamp(18px,5vw,36px);line-height:1;pointer-events:none}
.wk .nm{font:800 clamp(12px,3.3vw,19px)/1.3 var(--display);background:#fff;color:var(--ink);border-radius:999px;padding:0 .5em;pointer-events:none}
.wk.hi .em{font-size:clamp(14px,3.8vw,26px)}
.dock{--n:8}
.dock.wide{--n:10}
.dock:not(.wide) .x{display:none}
.bk{position:absolute;top:0;width:calc(64% / var(--n));height:56%;transform:translateX(-50%);z-index:2;border:0;border-radius:0 0 9px 9px;background:#120C2E;box-shadow:inset 0 -9px 0 rgba(255,255,255,.14),0 3px 0 rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.keys.guiding .wk:not(.target){opacity:.32}
.keys.guiding .bk:not(.target){background:#3A3263;box-shadow:none}
.wk.target::before{content:"★";position:absolute;top:8%;left:0;right:0;text-align:center;font-size:clamp(24px,6.5vw,46px);line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.22);animation:hop .6s ease-in-out infinite alternate;pointer-events:none}
.bk.target{box-shadow:0 0 0 4px var(--sun),0 0 22px 4px var(--sun)}
.bk.target::before{content:"★";position:absolute;bottom:12%;left:0;right:0;text-align:center;font-size:clamp(14px,4vw,26px);color:var(--sun);animation:hop .6s ease-in-out infinite alternate;pointer-events:none}
.wk.down{transform:translateY(5px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.bk.down{transform:translateX(-50%) translateY(4px)}
.wk.demo,.bk.demo{opacity:1!important;box-shadow:0 0 0 4px #fff,0 0 26px 6px #fff;z-index:3}
.wk.nope{animation:shake .28s}
.shake{animation:shake .28s}
.bk.shake{animation:shakeb .28s}
@keyframes shakeb{25%{transform:translateX(calc(-50% - 4px))}75%{transform:translateX(calc(-50% + 4px))}}
@media (max-height:440px){:root{--kh:128px}header{padding:4px 16px 9px}main{padding-top:10px}.strip{min-height:36px}}

/* falling notes (songs) */
.roll{position:relative;height:clamp(110px,26vh,300px);overflow:hidden;border-radius:12px 12px 0 0;border-bottom:4px solid var(--sun);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 calc(100% / var(--n) - 1px),rgba(255,255,255,.16) calc(100% / var(--n) - 1px) calc(100% / var(--n)))}
.roll[hidden],.dots[hidden]{display:none}
.track{position:absolute;left:0;right:0;bottom:0;height:0;will-change:transform}
.bar{position:absolute;width:calc(100% / var(--n) - 4px);background:var(--c);border-radius:10px;display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 4px 0 rgba(255,255,255,.32),inset 0 -4px 0 rgba(0,0,0,.16)}
.bar.blk{width:calc(64% / var(--n));background:#120C2E;box-shadow:0 0 0 3px var(--sun);z-index:1}
.bar.blk span{color:var(--sun)}
.bar span{font-size:clamp(14px,3.6vw,26px);line-height:1;padding-bottom:4px}
.ctl{margin-left:auto;flex:none;display:flex;gap:6px}
.ctl:empty{display:none}
.cbtn{min-width:44px;height:40px;padding:0 14px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font:800 16px var(--display);cursor:pointer}
.cbtn.sun{background:var(--sun);color:var(--ink)}
.cbtn[aria-pressed="true"]{background:#fff;color:var(--ink)}
.dock.rolling{--kh:clamp(128px,30vh,260px)}
.dock.rolling .prompt{max-width:none;flex:1;min-width:0}

/* celebration */
#toast{position:fixed;left:50%;top:26%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;background:var(--paper);color:var(--ink);font:800 clamp(26px,7vw,44px) var(--display);padding:10px 30px;border-radius:999px;border:6px solid var(--sun);white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:19}

@keyframes hop{from{transform:translateY(0)}to{transform:translateY(22%)}}
@keyframes hop1{0%{transform:translateY(0)}40%{transform:translateY(-22%)}100%{transform:translateY(0)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#aulas">Piano da Maya</a>
  <nav aria-label="Seções">
    <a href="#aulas" data-tab="aulas">Aulas</a>
    <a href="#musicas" data-tab="musicas">Músicas</a>
    <a href="#jogos" data-tab="jogos">Jogos</a>
    <a href="#guia" data-tab="guia">Guia</a>
  </nav>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<div class="dock" id="dock">
  <div class="strip">
    <div class="prompt" id="prompt" aria-live="polite"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="ctl" id="ctl"></div>
  </div>
  <div class="roll" id="roll" hidden aria-hidden="true"><div class="track" id="track"></div></div>
  <div class="keys" id="keys"></div>
</div>

<div id="toast" role="status"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<template id="guia-tpl">
  <h1>Guia para quem ensina</h1>
  <p class="lead">Cinco minutos de leitura antes da primeira aula. O resto do curso é para fazer junto com a Maya, com ela no colo ou ao lado.</p>
  <div class="prose">
    <section>
      <h2>O que esperar aos 3 anos</h2>
      <p>Nesta idade, aprender piano é brincar com som. O objetivo do curso é que a Maya goste do instrumento, reconheça grave e agudo, encontre as teclas pelo desenho e pela cor e toque melodias curtas com um dedo.</p>
      <ul>
        <li>Um dedo só (o indicador) está ótimo. Dedos independentes e posição de mão costumam vir entre 4 e 5 anos.</li>
        <li>Ela não precisa ler nada. As cores e os desenhos fazem o papel da partitura.</li>
        <li>Repetir a mesma aula por duas ou três semanas é normal e desejável.</li>
        <li>Terminar o curso tocando duas ou três músicas com ajuda das cores é um ótimo resultado.</li>
      </ul>
    </section>
    <section>
      <h2>Como dar cada aula</h2>
      <ol>
        <li><strong>1 minuto de toque livre.</strong> Deixe ela apertar o que quiser.</li>
        <li><strong>5 minutos de aula.</strong> Leia em voz alta a frase amarela e siga os passos. Mostre primeiro, toquem juntos, depois ela sozinha.</li>
        <li><strong>2 minutos de algo que ela já sabe.</strong> Uma música antiga ou um jogo.</li>
        <li><strong>Aplausos.</strong> Sempre termine com uma vitória, mesmo pequena.</li>
      </ol>
      <p>Três ou quatro sessões curtas por semana rendem mais que uma longa. Pare antes de ela cansar: é melhor ela pedir mais do que querer sair.</p>
      <p>Cante o nome das notas enquanto ela toca (“Mi, Ré, Dó”). Cantar é o que fixa a melodia nessa idade.</p>
    </section>
    <section>
      <h2>As cores e os amigos das notas</h2>
      <div class="legend" id="legend"></div>
      <p>Cada nota tem uma cor e um desenho cujo nome começa com o som da nota. Use sempre as mesmas palavras: “o Dó do doce”, “o Mi do milho”.</p>
    </section>
    <section>
      <h2>Plano de 10 semanas</h2>
      <div class="tablebox">
        <table>
          <thead><tr><th>Semana</th><th>Aula</th><th>Pode avançar quando ela…</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>Olá, piano!</td><td>aperta uma tecla de cada vez, sem bater com a mão toda</td></tr>
            <tr><td>2</td><td>Elefante e passarinho</td><td>acerta grave ou agudo na maioria das vezes</td></tr>
            <tr><td>3</td><td>As teclas pretas</td><td>aponta as gêmeas e as trigêmeas sem a estrela</td></tr>
            <tr><td>4</td><td>A casa do Dó</td><td>encontra o Dó sozinha</td></tr>
            <tr><td>5</td><td>Tartaruga e coelho</td><td>muda de devagar para rápido junto com o bicho</td></tr>
            <tr><td>6</td><td>Dó, Ré, Mi</td><td>toca Dó, Ré, Mi subindo e descendo</td></tr>
            <tr><td>7</td><td>Pão quentinho</td><td>toca a música seguindo as estrelas</td></tr>
            <tr><td>8</td><td>Fá e Sol</td><td>sobe e desce as cinco notas</td></tr>
            <tr><td>9</td><td>Lá e a estrelinha</td><td>toca o começo da estrelinha</td></tr>
            <tr><td>10</td><td>O concerto da Maya</td><td>escolhe e toca uma música para a família</td></tr>
          </tbody>
        </table>
      </div>
      <p>O ritmo é dela. Se uma aula levar um mês, o plano continua certo.</p>
    </section>
    <section>
      <h2>Do tablet para um piano de verdade</h2>
      <ul>
        <li>Cole adesivos redondos com as mesmas cores nas teclas do Dó central até o Dó seguinte. Tudo o que ela aprendeu aqui passa a valer lá.</li>
        <li>Use um banquinho firme e um apoio para os pés, para ela não ficar pendurada.</li>
        <li>No teclado real ela descobre o forte e o suave, que a tela não tem. Brinquem de “tocar como formiga” e “tocar como leão”.</li>
      </ul>
    </section>
    <section>
      <h2>Se ela não quiser hoje</h2>
      <ul>
        <li>Toque você e deixe ela só ouvir ou dançar. Conta como aula.</li>
        <li>Troque a aula por um jogo. O Eco e o Quem cantou? treinam o ouvido do mesmo jeito.</li>
        <li>Não corrija a tecla errada. A estrela continua pulando na certa e ela acha sozinha.</li>
      </ul>
    </section>
    <section>
      <h2>Dicas técnicas</h2>
      <ul>
        <li>Use o tablet ou celular deitado, apoiado na mesa. As teclas ficam maiores.</li>
        <li>Sem som no iPhone ou iPad? Desligue o modo silencioso e aumente o volume.</li>
        <li>No computador, as teclas <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd> tocam de Dó a Dó.</li>
        <li>As estrelas ficam guardadas só neste aparelho e navegador.</li>
      </ul>
    </section>
  </div>
</template>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- notes ---------- */
const N = {
  C: { m: 60, n: 'Dó', c: 'var(--do)', e: '🍭', w: 'doce' },
  D: { m: 62, n: 'Ré', c: 'var(--re)', e: '👑', w: 'rei' },
  E: { m: 64, n: 'Mi', c: 'var(--mi)', e: '🌽', w: 'milho' },

/* ---------- celebration ---------- */
const toast = $('#toast'), fx = $('#fx');
const PRAISE = ['Muito bem, Maya!', 'Que lindo!', 'Bravo, Maya!', 'Você conseguiu!'];
function celebrate() {
  sndCheer();
  toast.textContent = '⭐ ' + pick(PRAISE);
  toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1900);
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) confetti();
}
function confetti() {
  const g = fx.getContext('2d'), W = fx.width = innerWidth, H = fx.height = innerHeight;
  const cols = ['#EF3E36', '#F7892B', '#F7C61C', '#3FB950', '#1FA9D6', '#7557E0', '#EC5BA9'];
  const ps = Array.from({ length: 90 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .5, y: H * .3, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 3, s: 6 + Math.random() * 8, c: pick(cols), r: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    const k = (t - t0) / 1800;
    g.clearRect(0, 0, W, H);
    if (k >= 1) return;
    g.globalAlpha = 1 - k * k;
    ps.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.r += .2; g.fillStyle = p.c; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); });
    requestAnimationFrame(frame);
  })(t0);
}

function activityView(o) {
  /* o: back {href,label}, heading node, say, tip, act, key, steps?, footer(nextBtn) */
  const host = el('div', { class: 'act' });
  const nodes = [el('a', { class: 'back', href: o.back.href }, '← ' + o.back.label), o.heading];
  if (o.stepdots) nodes.push(o.stepdots);
  nodes.push(el('section', { class: 'say' }, el('p', { class: 'eyebrow' }, 'Diga para a Maya'), el('p', { class: 'script' }, o.say), o.tip && el('p', { class: 'tip' }, o.tip)));

  if (o.footer) nodes.push(o.footer);
  view.replaceChildren(...nodes);
  startAct(o.act, host, () => { mark(o.key); celebrate(); if (o.onDone) o.onDone(); });
}

function viewLesson(L, s) {
  const les = LESSONS[L]; s = Math.max(0, Math.min(s, les.steps.length - 1)); stepAt[L] = s;
  const st = les.steps[s], last = s === les.steps.length - 1;
  const go = j => { viewLesson(L, j); mainEl.scrollTop = 0; };
  const sd = el('div', { class: 'stepdots', role: 'group', 'aria-label': 'Passos da aula' }, les.steps.map((_, j) =>
    el('button', { class: 'sd' + (j === s ? ' on' : '') + (prog[`a${L}-${j}`] ? ' done' : ''), type: 'button', 'aria-label': 'Passo ' + (j + 1), onclick: () => go(j) }, j + 1)));
  const next = last
    ? el('a', { class: 'btn', href: L + 1 < LESSONS.length ? '#aula-' + (L + 2) : '#musicas' }, L + 1 < LESSONS.length ? 'Próxima aula →' : 'Ir para as músicas →')
    : el('button', { class: 'btn', type: 'button', onclick: () => go(s + 1) }, 'Próximo passo →');
  const prev = el('button', { class: 'btn ghost', type: 'button', disabled: s === 0, onclick: () => go(s - 1) }, '← Voltar');
  activityView({
    back: { href: '#aulas', label: 'Todas as aulas' },
    heading: el('div', { class: 'ltitle' }, el('span', { class: 'num', style: `--c:${RAINBOW[L % 7]}` }, L + 1), el('h1', {}, les.title)),
    stepdots: sd, say: st.say, tip: st.tip, act: st.act, key: `a${L}-${s}`,
    footer: el('div', { class: 'row end' }, prev, next),
    onDone() { next.classList.add('pulse'); sd.children[s].classList.add('done'); }
  });
}

function viewGuide() {
  view.replaceChildren($('#guia-tpl').content.cloneNode(true));
  $('#legend', view).innerHTML = WHITE.slice(0, 7).map(id => `<span class="chip" style="--c:${N[id].c}"><i></i>${N[id].e} ${N[id].n} do ${N[id].w}</span>`).join('');
}

function route() {
  const h = (location.hash || '').slice(1) || 'aulas';
  stopAct();
  let tab = 'aulas', m;
  if ((m = /^aula-(\d+)$/.exec(h)) && LESSONS[m[1] - 1]) { const L = m[1] - 1; viewLesson(L, stepAt[L] || 0); }
  else if (h === 'musicas') { tab = 'musicas'; viewSongs(); }
  else if ((m = /^musica-([a-z0-9]+)$/.exec(h)) && SONGS.find(s => s.id === m[1])) { tab = 'musicas'; viewSong(SONGS.find(s => s.id === m[1])); }
  else if (h === 'jogos') { tab = 'jogos'; viewGames(); }
  else if ((m = /^jogo-([a-z0-9]+)$/.exec(h)) && GAMES.find(g => g.id === m[1])) { tab = 'jogos'; viewGame(GAMES.find(g => g.id === m[1])); }
  else if (h === 'guia') { tab = 'guia'; viewGuide(); }
  else viewHome();
  dock.hidden = tab === 'guia';
  document.querySelectorAll('header nav a').forEach(a => {
    const on = a.dataset.tab === tab; a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  mainEl.scrollTop = 0;
}

buildKeys();
setPrompt(FREE);
window.addEventListener('hashchange', route);
route();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
